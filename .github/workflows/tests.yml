name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m pytest -m "not gui" --junitxml=artifacts/core.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-results
          path: artifacts/core.xml
  gui:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      QT_API: pyside6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -m gui --junitxml=artifacts/gui.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-results
          path: artifacts/
