[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robotstudio-ai"
version = "0.3.0"
description = "Offline robot workbench with Generic and official S922 CAD reference models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3", "scipy>=1.14,<2", "pydantic>=2.9,<3", "PyYAML>=6,<7",
  "PySide6>=6.8,<7", "pyvista>=0.44,<0.50", "pyvistaqt>=0.11,<0.15",
  "vtk>=9.3,<10", "trimesh>=4.5,<6",
  "python-fcl==0.7.0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9,<1", "build>=1,<2"]
bundle = ["pyinstaller>=6.11,<7"]
cad = ["cadquery-ocp-novtk==7.9.3.1"]

[project.scripts]
robotstudio-ai = "robotstudio_ai.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robotstudio_ai = ["data/**/*.yaml", "data/**/*.urdf", "data/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
markers = ["gui: Qt/VTK integration (requires an OpenGL capable desktop)",
           "cad_assets: local manufacturer CAD assets (not redistributed)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
